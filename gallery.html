<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap"
      rel="stylesheet"
    />
    <title>Photo tour · Luxury Villa</title>
  </head>
  <body class="page-gallery">
    <header class="site-header">
      <nav class="nav" id="nav" aria-label="Main navigation">
        <div class="nav__inner">
          <a href="index.html" class="nav__brand">
            <img
              src="./assets/images/logo2.png"
              alt="Luxury Villa"
              class="nav__logo"
              width="160"
              height="48"
            />
          </a>

          <button
            type="button"
            class="nav__toggle"
            id="nav-toggle"
            aria-expanded="false"
            aria-controls="nav-menu"
            aria-label="Open menu"
          >
            <span class="nav__toggle-bar" aria-hidden="true"></span>
            <span class="nav__toggle-bar" aria-hidden="true"></span>
            <span class="nav__toggle-bar" aria-hidden="true"></span>
          </button>

          <div class="nav__panel" id="nav-menu">
            <ul class="nav__links">
              <li><a class="nav__link" href="index.html#hero">Home</a></li>
              <li><a class="nav__link" href="index.html#the-villa">The Villa</a></li>
              <li><a class="nav__link" href="index.html#amenities">Amenities</a></li>
              <li><a class="nav__link" href="gallery.html" aria-current="page">Gallery</a></li>
              <li><a class="nav__link" href="rates.html">Price</a></li>
              <li><a class="nav__link" href="index.html#location">Location</a></li>
              <li><a class="nav__link" href="index.html#contact">Contact</a></li>
            </ul>
            <a class="nav__cta nav__cta--in-panel" href="index.html#contact">Book now</a>
          </div>

          <a class="nav__cta nav__cta--bar" href="index.html#contact">Book now</a>
        </div>
      </nav>
    </header>

    <main>
      <section
        id="gallery"
        class="section section--photo-tour photo-tour"
        tabindex="-1"
        aria-labelledby="gallery-heading"
      >
        <div class="photo-tour__shell">
          <header class="photo-tour__top">
            <p class="section__eyebrow photo-tour__eyebrow">Gallery</p>
            <h1 id="gallery-heading" class="photo-tour__heading">Photo tour</h1>
            <p class="photo-tour__sub">
              Explore each space—click any photo to view it full size.
            </p>
          </header>
          <nav
            class="photo-tour__category-nav"
            id="gallery-category-nav"
            aria-label="Jump to a room"
          ></nav>
          <div class="photo-tour__sections" id="gallery-sections"></div>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Luxury Villa. All rights reserved.</p>
    </footer>

    <div
      id="lightbox"
      class="lightbox-gallery"
      role="dialog"
      aria-modal="true"
      aria-label="Photo viewer"
      hidden
    >
      <div class="lightboxOverlay" data-gallery-lightbox-close tabindex="-1"></div>
      <div class="lightboxContent">
        <button type="button" class="lightboxClose" id="lightboxClose" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
        <img src="" alt="" class="lightboxImg" id="lightboxImg" width="1600" height="1200" />
        <div class="lightboxNav">
          <button type="button" class="lightboxArrow lightboxPrev" id="lightboxPrev" aria-label="Previous photo">
            &#8249;
          </button>
          <button type="button" class="lightboxArrow lightboxNext" id="lightboxNext" aria-label="Next photo">
            &#8250;
          </button>
        </div>
        <p class="lightboxMeta" id="lightboxMeta" aria-live="polite"></p>
        <div class="lightboxCounter" id="lightboxCounter">1 / 1</div>
      </div>
    </div>

    <script src="app.js" defer></script>
  </body>
</html>
